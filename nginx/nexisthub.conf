server {
    listen 80;
    server_name _;

    client_max_body_size 200M;   # impor dokumen: ZIP scan bisa ratusan MB

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s;

    # API → FastAPI backend
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200M;
        proxy_read_timeout 300s;      # unggah ZIP besar butuh waktu
        proxy_send_timeout 300s;
        proxy_request_buffering off;  # stream ke backend, jangan buffer seluruh body dulu
    }

    # Docs
    location /docs {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Frontend React SPA
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
